<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New electric car sales by country, 2025 | MobilityCharts embed</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
  body { background: var(--surface); }
  .embed-wrap { padding: 16px 16px 10px; }
  .embed-head { font-family: var(--serif); font-size: 17px; font-weight: 700; margin: 0 0 3px; }
  .embed-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
  .embed-foot {
    margin-top: 8px; padding-top: 9px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .embed-foot a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="embed-wrap">
  <p class="embed-head">New electric cars sold, 2025</p>
  <p class="embed-sub">Thousands of cars, top 15 countries</p>
  <div id="chart"></div>
  <div class="embed-foot">
    <span>IEA (2026), Global EV Outlook 2026, CC BY 4.0 · processed by Our World in Data</span>
    <span>Chart by <a href="https://mobilitycharts.com/charts/electric-car-sales-by-country/" target="_blank" rel="noopener">MobilityCharts</a></span>
  </div>
</div>

<script src="../assets/chart.js"></script>
<script src="../data/electric-car-sales-by-country/data.js"></script>
<script>
(function () {
  var d = window.DATASETS['electric-car-sales-by-country'];
  MC.render({
    mount: '#chart', type: 'bar', data: d.rows,
    unit: 'Thousands of cars sold, ' + d.latestYear,
    decimals: 0,
    source: 'IEA Global EV Outlook 2026 via Our World in Data, CC BY 4.0',
    sourceDate: d.latestYear,
    alt: 'Bar chart ranking countries by new electric car sales in 2025'
  });
})();
</script>
</body>
</html>
